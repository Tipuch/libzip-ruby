name: docs

# doc/api.rb is the API reference: the extension is Zig, which RDoc can't
# parse, so the Ruby surface is written out by hand.  `script/doc --check`
# compares it with the built extension before anything goes live, so the site
# can't describe methods the gem doesn't have.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and no cancelling one halfway: the site is the artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    # Keeps the Zig cache inside the workspace, at one path on every runner,
    # which is what actions/cache stores.
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.cache/zig
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1
        with:
          ruby-version: "3.4"
      # The Zig global cache holds the dependency sources and the compiled
      # objects of libzip, zlib and mbedTLS: ~88 MB, and the difference between
      # a 2m11s cold build and a 17s warm one.  `master` moves, so the key
      # carries the version it resolves to today, not the word in mise.toml.
      - id: zig
        run: echo "version=$(script/install-zig --resolve)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/zig
          key: zig-${{ runner.os }}-${{ steps.zig.outputs.version }}-ruby-3.4-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: zig-${{ runner.os }}-${{ steps.zig.outputs.version }}-ruby-3.4-
      # No marketplace action: script/install-zig is curl and tar, and it takes
      # the version from mise.toml, the same file a local checkout uses.
      - run: script/install-zig
      # --check loads the real extension, so it has to exist.
      - run: zig build
      - run: script/doc --check
      - run: script/doc
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: doc/html

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
