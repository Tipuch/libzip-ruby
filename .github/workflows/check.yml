name: check

# The gem is built -Doptimize=ReleaseFast, which disables Zig's implicit safety
# checks. This confirms the explicit ones do the job.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    # Keeps the Zig cache inside the workspace, at one path on every runner,
    # which is what actions/cache stores.
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.cache/zig
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
      # The Zig global cache holds the dependency sources and the compiled
      # objects of libzip, zlib and mbedTLS: ~88 MB, and the difference between
      # a 2m11s cold build and a 17s warm one.  `master` moves, so the key
      # carries the version it resolves to today, not the word in mise.toml.
      - id: zig
        run: echo "version=$(script/install-zig --resolve)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/zig
          key: zig-${{ runner.os }}-${{ steps.zig.outputs.version }}-ruby-${{ matrix.ruby }}-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: zig-${{ runner.os }}-${{ steps.zig.outputs.version }}-ruby-${{ matrix.ruby }}-
      # No marketplace action: script/install-zig is curl and tar, and it takes
      # the version from mise.toml, the same file a local checkout uses.
      - run: script/install-zig
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: script/check
      # doc/api.rb declares the Ruby API by hand; this fails the build when it
      # no longer matches src/*.zig.
      - run: script/doc --check
