name: package

# Builds libzip_ruby for each (platform, Ruby ABI) combination and wraps each
# platform into a gem.  Only Zig is needed for the Linux targets: Zig cross-
# compiles all 4 from one runner, and the 2 Darwin platforms from one macOS
# runner.  The matrix comes from `script/package matrix`, so the target
# list is defined in a single place.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      rubies:
        description: Ruby ABIs to build (comma separated)
        default: "3.3,3.4,4.0"

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-26.04
    outputs:
      compile: ${{ steps.emit.outputs.compile }}
      gem: ${{ steps.emit.outputs.gem }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Emit matrix
        id: emit
        run: |
          script/package matrix --rubies="$RUBIES" > matrix.json
          ruby -rjson -e '
            m = JSON.parse(File.read("matrix.json"))
            File.write(ENV["GITHUB_OUTPUT"], "compile=#{m["compile"].to_json}\ngem=#{m["gem"].to_json}\n", mode: "a")
          '
          cat matrix.json
        env:
          # On a tag push `inputs` is empty, so fall back to the default set.
          RUBIES: ${{ inputs.rubies || '3.3,3.4,4.0' }}

  compile:
    name: compile ${{ matrix.os }} ruby ${{ matrix.ruby }}
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.compile) }}
    runs-on: ${{ matrix.runner }}
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.cache/zig
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: false
      - id: zig
        run: echo "version=$(script/install-zig --resolve)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .cache/zig
          key: zig-${{ runner.os }}-${{ steps.zig.outputs.version }}-ruby-${{ matrix.ruby }}-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: zig-${{ runner.os }}-${{ steps.zig.outputs.version }}-ruby-${{ matrix.ruby }}-
      - run: script/install-zig

      - name: Build
        run: script/package build --targets=${{ join(matrix.targets, ',') }}

      - uses: actions/upload-artifact@v4
        with:
          name: so-${{ matrix.os }}-${{ matrix.ruby }}
          path: pkg/*/lib
          if-no-files-found: error

  gem:
    name: gem ${{ matrix.platform }}
    needs: [matrix, compile]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.gem) }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - uses: actions/download-artifact@v4
        with:
          pattern: so-*
          path: pkg
          merge-multiple: true

      - name: Assemble
        run: script/package gem --targets=${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: gem-${{ matrix.platform }}
          path: pkg/*.gem
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: gem
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: gem-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.gem

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - uses: rubygems/configure-rubygems-credentials@v2.1.0

      - name: Push to RubyGems
        run: |
          for file in dist/*.gem; do
            gem push "$file"
          done
